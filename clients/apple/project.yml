name: Narrowcast
options:
  bundleIdPrefix: com.pierr3
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  NarrowcastProtocol:
    path: NarrowcastProtocol
  NarrowcastClient:
    path: NarrowcastClient

targets:
  Narrowcast:
    type: application
    platform: iOS
    sources:
      - path: Narrowcast
    dependencies:
      - package: NarrowcastProtocol
      - package: NarrowcastClient
    info:
      path: Narrowcast/Resources/Info.plist
      properties:
        CFBundleDisplayName: Narrowcast
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - armv7
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pierr3.narrowcast
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_ASSET_PATHS: ""
        GENERATE_INFOPLIST_FILE: NO
