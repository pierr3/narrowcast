name: Narrowcast
options:
  bundleIdPrefix: com.pierr3
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Vendor/Opus.xcframework ships ios-arm64-simulator only (no x86_64 sim).
# Apple Silicon Macs run sim arm64 natively; restricting here ensures the
# linker doesn't try x86_64 and silently exclude every libopus object.
settings:
  base:
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

packages:
  NarrowcastProtocol:
    path: NarrowcastProtocol
  NarrowcastClient:
    path: NarrowcastClient

targets:
  Narrowcast:
    type: application
    platform: iOS
    sources:
      - path: Narrowcast
    dependencies:
      - package: NarrowcastProtocol
      - package: NarrowcastClient
      - framework: Vendor/Opus.xcframework
        embed: false  # static library, no runtime embedding needed
    info:
      path: Narrowcast/Resources/Info.plist
      properties:
        CFBundleDisplayName: Narrowcast
        # GENERATE_INFOPLIST_FILE is NO so Xcode doesn't auto-inject these.
        # Pull from build settings via the $() reference syntax so the
        # values stay sourced from MARKETING_VERSION + CURRENT_PROJECT_VERSION
        # in this file (and `make bump-build` keeps working).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes:
          - audio
        # Support every orientation. iPad multitasking (split view, slide
        # over) requires this — without it Xcode warns and the App Store
        # rejects iPad submissions. SwiftUI adapts the layout, so no extra
        # work needed on the view side.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UIRequiredDeviceCapabilities:
          - arm64
        # Encryption export compliance. We use TLS 1.3 / standard QUIC for
        # transport; that falls under the 5D002 mass-market exemption so a
        # full export classification isn't needed. Setting this to false
        # makes TestFlight submission skip the manual classification prompt.
        # App Store / TestFlight require an asset-catalog AppIcon and
        # CFBundleIconName referencing it. The build setting below tells
        # the asset compiler which icon set to extract.
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        # Required for connecting to an unresolved / .local Pi on the LAN.
        # Connecting to the relay over a public domain doesn't need this,
        # but the toggle lets users add a direct-Pi server entry.
        NSLocalNetworkUsageDescription: Narrowcast connects to a Pi on your local network when you save a server with a private address.
    # Signing.local.xcconfig (gitignored) provides DEVELOPMENT_TEAM and
    # PROVISIONING_PROFILE_SPECIFIER so the team ID + profile name never
    # land in version control. Copy Signing.example.xcconfig before first
    # build. xcconfig values override the base settings below.
    configFiles:
      Debug: Signing.local.xcconfig
      Release: Signing.local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pierr3.narrowcast
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: ""
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          # No Apple Development cert on this Mac, so Debug builds skip
          # signing entirely. Sim works without it. To run Debug on a
          # tethered device later, create a Development cert (same CSR
          # flow as the Distribution one) and remove this block.
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: ""
